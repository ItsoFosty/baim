name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BAIM_REQUIRE_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install required Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Verify generated animation metadata is current
        run: git diff --exit-code -- src/content/art/externalAnimationV1.generated.js
      - name: Verify animation catalog is current
        run: npm run check:animation-catalog
